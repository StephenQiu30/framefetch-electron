appId: com.stephenqiu.framefetch.desktop
productName: Framefetch
asar: true
npmRebuild: false
directories:
  output: release
files:
  - out/main/**
  - out/renderer/**
  - package.json
  - resources/icons/icon-512.png
  - resources/licenses/**
  - '!node_modules/**'
artifactName: Framefetch-${version}-${os}-${arch}.${ext}
mac:
  icon: resources/icons/icon.icns
  target: [dmg]
  category: public.app-category.video
  minimumSystemVersion: '14.0'
  identity: null
  hardenedRuntime: true
  notarize: false
dmg:
  sign: false
win:
  icon: resources/icons/icon.ico
  target: [nsis]
  signExecutable: false
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
