name: Bug 报告
description: 报告可复现的桌面页面、连接、原生能力或安装问题
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，并删除 Cookie、Token、环境文件、完整媒体 URL、预签名链接与用户私有内容。安全漏洞请私下报告。
  - type: dropdown
    id: component
    attributes:
      label: 涉及模块
      options:
        - 页面与 Frontend 一致性
        - 后端连接或登录会话
        - 服务端数据展示
        - 文件导入或原生保存
        - 构建或安装包
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 桌面 Release 或 commit；如与接口相关，可补充 Server 版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、架构、开发态或安装态；界面问题附视口与明暗主题
      placeholder: macOS，arm64，安装态，1260px，亮色
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小稳定步骤，使用脱敏或公开测试内容，不提交真实账号材料
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 页面一致性问题请描述同视口、主题、身份与数据状态下的 Frontend 行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 删除账号、密钥、完整 URL、用户内容和敏感路径后再附证据
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，且此问题不包含需要私下报告的漏洞或敏感材料。
          required: true
        - label: 复现只使用我有权处理的内容，且不要求绕过 DRM 或访问控制。
          required: true
