name: Desktop checks and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: --mac --arm64
            executable: release/mac-arm64/Framefetch.app/Contents/MacOS/Framefetch
          - runner: windows-2022
            target: --win --x64
            executable: release/win-unpacked/Framefetch.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: '12.4.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm frontend:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:e2e
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - name: Packaged client transport tests
        env:
          FRAMEFETCH_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: pnpm test:e2e
      - name: Upload failed end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: framefetch-e2e-${{ runner.os }}
          path: .artifacts/e2e/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: framefetch-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
