name: Desktop checks and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: --mac --arm64
            executable: release/mac-arm64/Framefetch.app/Contents/MacOS/Framefetch
          - runner: windows-2022
            target: --win --x64
            executable: release/win-unpacked/Framefetch.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: '12.4.2'
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify frontend snapshot
        run: pnpm frontend:check
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build client
        run: pnpm build
      - name: Source client transport tests
        run: pnpm test:e2e
      - name: Package client
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
      - name: Packaged client transport tests
        env:
          FRAMEFETCH_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: pnpm test:e2e
      - name: Upload failed end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: framefetch-e2e-${{ runner.os }}
          path: .artifacts/e2e/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: framefetch-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
