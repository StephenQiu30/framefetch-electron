[project]
name = "framefetch-desktop"
version = "0.1.0"
description = "Independent stdio desktop media engine"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic==2.12.5",
  "httpx==0.28.1",
  "python-docx==1.2.0",
  "pypdf==6.5.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.10", "mypy==1.19.1", "pyinstaller==6.17.0"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framefetch_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/framefetch_desktop"]

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true
